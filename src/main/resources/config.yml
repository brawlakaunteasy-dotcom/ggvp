# ExAntiBotFilter konfiguratsiyasi
# Barcha xabarlarda & rang kodlari ishlaydi.

# Captcha sozlamalari
captcha:
  # Necha sekund tanlash uchun beriladi (page bo'yicha qayta boshlanadi)
  timeout-seconds: 60
  # Birinchi sahifada nechta cookie kerak (vazifa: hammasini bossin)
  cookies-page1: 5
  # Ikkinchi sahifada nechta cookie kerak (xato qilganda)
  cookies-page2: 5
  # Wrong click qachon kick qiladi (1 = page2 da xato bo'lsa kick)
  max-wrong-pages: 2
  # Menyu sarlavhasi (Java edition)
  title-page1: "&8Cookie tanlang &7(1/2)"
  title-page2: "&cQayta urining &7(2/2)"
  # Cookie nomi va lore
  cookie-name: "&6&lCookie &7(bosing)"
  cookie-lore:
    - "&7Bot emasligingizni isbotlash uchun"
    - "&7barcha &ecookie&7larni o'ng tugma bilan bosing."
  # Random itemlar (nomi)
  filler-materials:
    - APPLE
    - BREAD
    - CAKE
    - CARROT
    - POTATO
    - BAKED_POTATO
    - GOLDEN_APPLE
    - GOLDEN_CARROT
    - MELON_SLICE
    - PUMPKIN_PIE
    - BEEF
    - COOKED_BEEF
    - CHICKEN
    - COOKED_CHICKEN
    - PORKCHOP
    - COOKED_PORKCHOP
    - MUTTON
    - COOKED_MUTTON
    - SALMON
    - COOKED_SALMON
    - COD
    - COOKED_COD
    - TROPICAL_FISH
    - PUFFERFISH
    - SUGAR
    - SUGAR_CANE
    - WHEAT
    - HONEY_BOTTLE
    - MILK_BUCKET
    - EGG
    - DIAMOND
    - EMERALD
    - GOLD_INGOT
    - IRON_INGOT
    - REDSTONE
    - LAPIS_LAZULI
    - QUARTZ
    - COAL

# Filter himoya sozlamalari
protection:
  # Boshqa narsalarni qila olmaydi - faqat /server (va alyaslari)
  allowed-commands:
    - server
    - lobby
    - hub
  # Chat butunlay bloklanadi - hech narsa ko'rinmaydi (true bo'lsa hatto o'zi ko'rmaydi)
  silent-chat: true
  # Yurish, urish, item olish bloklansin
  block-movement: true
  block-damage: true
  block-interact: true
  block-item-pickup: true

# Xabarlar
messages:
  prefix: "&8[&6AntiBot&8] "
  passed: "&aSiz bot emasligingiz tasdiqlandi!"
  kick-bot: "&cSiz bot deb topildingiz.\n&7Iltimos qaytadan urining."
  kick-timeout: "&cVaqt tugadi! Qaytadan urining."
  reload-success: "&aPlugin qayta yuklandi."
  no-permission: "&cSizda bu buyruqdan foydalanish huquqi yo'q."

# Bedrock (Geyser/Floodgate) sozlamalari
bedrock:
  # Bedrock playerlarga maxsus Floodgate Form ishlatilsin (Form modal)
  # Bu Java menyusi Bedrock'da ko'rinmasligi muammosini hal qiladi.
  use-form: true
  form-title: "Bot tekshiruvi"
  form-content-page1: "Bot emasligingizni isbotlash uchun barcha cookie tugmalarini bosing.\n\nSahifa: 1/2"
  form-content-page2: "Qayta urining! Barcha cookie tugmalarini bosing.\n\nSahifa: 2/2"
  form-cookie-button: "Cookie"
  form-fake-buttons:
    - "Olma"
    - "Non"
    - "Tort"
    - "Sabzi"
    - "Kartoshka"
    - "Tovuq"
    - "Mol go'shti"
    - "Cho'chqa go'shti"
    - "Baliq"
    - "Tuxum"
    - "Sut"
    - "Olmos"
    - "Zumrad"
    - "Oltin"
    - "Temir"
