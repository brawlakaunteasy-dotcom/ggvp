name: Build ExAntiBotFilter

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Show artifacts
        run: ls -la target/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExAntiBotFilter-jar
          path: target/ExAntiBotFilter-*.jar
          if-no-files-found: error

      - name: Create / Update "latest" Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ExAntiBotFilter (latest build)
          body: |
            Avtomatik build — main branchidan.
            JAR fayli pastdagi assets ichida.
          files: target/ExAntiBotFilter-*.jar
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
